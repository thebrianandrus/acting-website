    <style>
      /* Gallery grid — inherits .photo styling from styles.css */
      .photo-gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      @media (max-width: 640px) {
        .photo-gallery {
          grid-template-columns: 1fr;
          gap: 12px;
        }
      }

      /* Wide cinematic stills — uniform 1904x800 ratio */
      .photo-gallery .photo {
        margin: 0;
        cursor: zoom-in;
      }
      .photo-gallery .photo img {
        display: block;
        width: 100%;
        aspect-ratio: 1904 / 800;
        object-fit: cover;
      }

      /* Lightbox */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.94);
        cursor: zoom-out;
      }
      .lightbox.open {
        display: flex;
      }
      .lightbox img {
        max-width: 94vw;
        max-height: 90vh;
        object-fit: contain;
      }
      .lightbox-close,
      .lightbox-prev,
      .lightbox-next {
        position: absolute;
        background: none;
        border: 0;
        color: #fff;
        opacity: 0.7;
        cursor: pointer;
        padding: 16px;
        line-height: 1;
        font-family: inherit;
      }
      .lightbox-close:hover,
      .lightbox-prev:hover,
      .lightbox-next:hover {
        opacity: 1;
      }
      .lightbox-close {
        top: 8px;
        right: 12px;
        font-size: 32px;
      }
      .lightbox-prev,
      .lightbox-next {
        top: 50%;
        transform: translateY(-50%);
        font-size: 40px;
      }
      .lightbox-prev {
        left: 4px;
      }
      .lightbox-next {
        right: 4px;
      }
      body.lightbox-lock {
        overflow: hidden;
      }
    </style>
  </head>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <button class="lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
      <img id="lightbox-img" src="" alt="" />
      <button class="lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
      <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
    </div>

    <script>
      (function () {
        var box = document.getElementById("lightbox");
        var boxImg = document.getElementById("lightbox-img");
        var items = Array.prototype.slice.call(
          document.querySelectorAll(".photo-gallery .photo img")
        );
        var index = 0;

        function show(i) {
          index = (i + items.length) % items.length;
          boxImg.src = items[index].src;
          boxImg.alt = items[index].alt;
        }

        function open(i) {
          show(i);
          box.classList.add("open");
          document.body.classList.add("lightbox-lock");
        }

        function close() {
          box.classList.remove("open");
          document.body.classList.remove("lightbox-lock");
          boxImg.src = "";
        }

        items.forEach(function (img, i) {
          img.addEventListener("click", function () {
            open(i);
          });
        });

        box.addEventListener("click", function (e) {
          if (e.target === box || e.target === boxImg) close();
        });

        box.querySelector(".lightbox-close").addEventListener("click", close);

        box.querySelector(".lightbox-prev").addEventListener("click", function (e) {
          e.stopPropagation();
          show(index - 1);
        });

        box.querySelector(".lightbox-next").addEventListener("click", function (e) {
          e.stopPropagation();
          show(index + 1);
        });

        document.addEventListener("keydown", function (e) {
          if (!box.classList.contains("open")) return;
          if (e.key === "Escape") close();
          if (e.key === "ArrowLeft") show(index - 1);
          if (e.key === "ArrowRight") show(index + 1);
        });
      })();
    </script>
